name: Diagnose difficult university portals
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_universities.py
      - .github/workflows/probe-universities.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_universities.py
