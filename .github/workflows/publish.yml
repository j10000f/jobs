name: Refresh and publish job mirrors
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/publish.yml
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: job-mirror-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile scripts/build.py
      - name: Fetch feeds and build static site
        run: python scripts/build.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Commit HTML and status to data branch
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir="$(mktemp -d)"
          cp -a public/. "$snapshot_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git switch --create data --track origin/data
          else
            git switch --orphan data
          fi
          # This branch is exclusively generated data, never hand-edited content.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$snapshot_dir"/. .
          git add --all
          if git diff --cached --quiet; then
            echo "Generated snapshot already up to date."
          else
            git commit -m "Update public job snapshots"
            git push origin HEAD:data
          fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
