name: Inspect TU Wien public job page
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/inspect_tu_wien.py
      - .github/workflows/inspect-tu-wien.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/inspect_tu_wien.py
