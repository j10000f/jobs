name: Verify public GitHub Pages access
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-pages.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public site
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time,socket
          host = "j10000f.github.io"
          try:
              print("DNS",host,socket.getaddrinfo(host,443)[0][4][0])
          except Exception as e:
              print("DNS FAILED",type(e).__name__,str(e))
          for url in ["https://j10000f.github.io/jobs/", "https://j10000f.github.io/jobs/tu-wien.html"]:
              for n in range(1,4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"JobsPageHealthcheck/1.0"}),timeout=15) as response:
                          page=response.read()
                          print("PAGE",url,"status",response.status,"bytes",len(page),"content-type",response.headers.get("Content-Type"),"has table",b"<table" in page)
                      break
                  except Exception as e:
                      print("ATTEMPT",n,url,type(e).__name__,str(e))
                      if n<3:time.sleep(5)
          PY
